# Podforge backend configuration template.
#
# Do NOT edit this file for local use — run ./scripts/setup.sh, which copies it to
# backend/config.yaml and fills in a generated JWT secret and your admin password.
# backend/config.yaml is gitignored so your secrets never get committed.
#
# This file is entirely optional for local development: with no config.yaml at all
# the backend starts with a built-in development JWT secret and an admin/admin
# login (both refused once server.env is "production").
#
# Env vars override file values: PORT, LOG_LEVEL, APP_ENV, KUBECONFIG, KUBE_CONTEXT,
# AUTH_ENABLED, AUTH_JWT_SECRET, OIDC_ISSUER, OIDC_CLIENT_ID, DATABASE_URL, SQLITE_PATH.

server:
  port: "8080"
  log_level: info   # debug | info | warn | error
  env: development  # development | production

kubernetes:
  # Path to your kubeconfig. Leave empty to use $HOME/.kube/config (or in-cluster
  # config when running inside Kubernetes).
  kubeconfig: ""
  # kubectl context to use. Empty = current active context.
  context: ""

# User storage. If postgres is configured it is used; otherwise Podforge falls
# back to a local SQLite file. No setup needed for SQLite.
database:
  postgres:
    dsn: ""
    host: ""
    port: "5432"
    user: ""
    password: ""
    dbname: ""
    sslmode: disable
  sqlite:
    path: podforge.db

auth:
  # Secure by default. setup.sh seeds a JWT secret and an admin user below.
  enabled: true
  token_ttl: 12h

  jwt:
    # Filled in by scripts/setup.sh (openssl rand -hex 32).
    secret: "__JWT_SECRET__"

  # Login users. Roles: viewer | editor | admin.
  #
  #   password       plaintext, for local development. Hashed on startup and
  #                  re-synced on every boot, so editing it here changes the
  #                  login immediately.
  #   password_hash  bcrypt hash (generate with: cd backend && go run ./cmd/hashpw).
  #                  Inserted only if the user does not exist yet, so password
  #                  and role changes made at runtime survive restarts.
  #
  # Use password_hash for anything that is not your laptop. Set one or the other,
  # never both. Quote bcrypt hashes so `$2a$...` is parsed as a string.
  users:
    - username: admin
      password: "__ADMIN_PASSWORD__"
      role: admin

  # Optional OIDC / SSO. Disabled by default; see backend/config.yaml comments in
  # the repo history or the README for how to wire up an identity provider.
  oidc:
    enabled: false
    issuer: ""
    client_id: ""
    username_claim: email
    roles_claim: groups
    role_mapping: {}
    allowed_domains: []
    default_role: ""
